<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Widget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f4f4f4;
        }
        .battery-container {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 420px;
        }
        .battery-level {
            font-size: 1.5em;
            margin: 10px 0;
        }
        .charging {
            color: green;
            font-weight: bold;
        }
        .discharging {
            color: red;
            font-weight: bold;
        }
        .battery-info {
            text-align: left;
            margin-top: 10px;
        }
        .battery-info p {
            font-size: 14px;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="battery-container">
        <h2>Laptop Battery Status</h2>
        <h2><p class="battery-level">Loading...</p></h2>
        <h2><p class="status">Checking battery status...</p></h2>

        <div class="battery-info">
            <p><strong>🔌 Charging Time:</strong> <span id="charging-time">N/A</span></p>
            <p><strong>⏳ Charging Duration:</strong> <span id="charging-duration">N/A</span></p>
            <p><strong>⚡ Battery Remaining:</strong> <span id="battery-remaining">N/A</span></p>
            <p><strong>🔋 Battery Backup:</strong> <span id="battery-backup">N/A</span></p>
        </div>
    </div>

    <script>
        function updateBatteryStatus(battery) {
            const batteryLevel = document.querySelector(".battery-level");
            const status = document.querySelector(".status");
            const chargingTime = document.getElementById("charging-time");
            const chargingDuration = document.getElementById("charging-duration");
            const batteryRemaining = document.getElementById("battery-remaining");
            const batteryBackup = document.getElementById("battery-backup");

            batteryLevel.textContent = `Battery: ${Math.round(battery.level * 100)}%`;

            if (battery.charging) {
                status.textContent = "⚡ Charging";
                status.className = "status charging";

                // Charging Time and Charging Duration
                if (!battery.charging || isNaN(battery.chargingTime) || battery.chargingTime <= 0 || battery.chargingTime === Infinity) {
                chargingTime.textContent = "Calculating...";
                chargingDuration.textContent = "Calculating...";
                } else {
                let totalMinutes = Math.floor(battery.chargingTime / 60);
                let hours = Math.floor(totalMinutes / 60);
                let remainingMinutes = totalMinutes % 60;

                chargingTime.textContent = `${totalMinutes} min`;
                chargingDuration.textContent = `${hours}h ${remainingMinutes}m`;
                }


                batteryRemaining.textContent = "Charging...";
                batteryBackup.textContent = "N/A";

            } else {
                status.textContent = "🔋 Discharging";
                status.className = "status discharging";

                chargingTime.textContent = "N/A";
                chargingDuration.textContent = "N/A";

                // Battery Remaining Time
                if (battery.dischargingTime === Infinity || battery.dischargingTime === 0) {
                    batteryRemaining.textContent = "Calculating...";
                } else {
                    let hours = Math.floor(battery.dischargingTime / 3600);
                    let minutes = Math.floor((battery.dischargingTime % 3600) / 60);
                    batteryRemaining.textContent = `${hours}h ${minutes}m`;
                }

                // Estimated Battery Backup
                if (battery.dischargingTime === Infinity || battery.dischargingTime === 0) {
                    batteryBackup.textContent = "Calculating...";
                } else {
                    batteryBackup.textContent = `${Math.round(battery.level * battery.dischargingTime / 60)} min`;
                }
            }
        }

        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                updateBatteryStatus(battery);
                battery.addEventListener("chargingchange", () => updateBatteryStatus(battery));
                battery.addEventListener("levelchange", () => updateBatteryStatus(battery));
                battery.addEventListener("chargingtimechange", () => updateBatteryStatus(battery));
                battery.addEventListener("dischargingtimechange", () => updateBatteryStatus(battery));
            });
        } else {
            document.querySelector(".battery-level").textContent = "Battery API not supported";
        }
    </script>

</body>
</html>
