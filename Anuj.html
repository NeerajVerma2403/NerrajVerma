<html>
    <script>
        function add()
        {
            var a=parseInt(txt1.value)
            var b=parseInt(txt2.value)
            var c=a+b
            result.innerHTML=("Addition= "+c)
        }
        function sub()
        {
            var a=parseInt(txt1.value)
            var b=parseInt(txt2.value)
            var c=a-b
            result.innerHTML=("Subtraction= "+c)
        }
        function clearAll()
        {
            txt1.value=" "
            txt2.value=" "
            result.innerHTML="See Here....."
        }
    </script>

    <input type="text" id="txt1" size="10%">
    <input type="text" id="txt2" size="10%">
    <br>
    <input type="button" value="Addition" onclick="add()">
    <input type="button" value="subtraction" onclick="sub()">
    <input type="button" value="clear all" onclick="clearAll()">

    <div id="result">see result..</div>
</html>
