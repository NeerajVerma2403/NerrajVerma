<script>
    function call()
    {
        if (language.value=="Hindi")
        {
            x="\u0928\u0940\u0930\u091C".normalize();
            alert(x)
        }

        else if (language.value=="Urdu")
        {
            x="\u0646\u06cc\u0631\u062c".normalize();
            alert(x)
        }
        
        else if (language.value=="Spanish")
        {
            x="\u004e\u0065\u0065\u0072\u0061\u006a".normalize();
            alert(x)
        }

    }
</script>
<html>
    <select id="language" onchange="call()">
        <option>-Select Language-</option>
        <option>Hindi</option>
        <option>Urdu</option>
        <option>Spanish</option>
    </select>
</html>
