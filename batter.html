<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Status Widget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #f4f4f4;
        }
        .widget {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        .battery-container {
            border: 2px solid #333;
            width: 200px;
            height: 50px;
            margin: 20px auto;
            position: relative;
            border-radius: 5px;
            overflow: hidden;
        }
        .battery-level {
            height: 100%;
            background-color: green;
            width: 0%;
            transition: width 0.5s;
        }
        .battery-status {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Battery Status Widget</h1>
    <div class="widget">
        <div class="battery-container">
            <div class="battery-level" id="batteryLevel"></div>
        </div>
        <div class="battery-status" id="batteryStatus">Loading...</div>
    </div>

    <script>
        function updateBatteryStatus(battery) {
            const level = battery.level * 100;
            const charging = battery.charging;
            const timeLeft = charging ? battery.chargingTime : battery.dischargingTime;
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            
            document.getElementById("batteryLevel").style.width = level + "%";
            document.getElementById("batteryLevel").style.backgroundColor = level < 20 ? "red" : "green";
            
            document.getElementById("batteryStatus").innerText = 
                `Battery: ${level.toFixed(0)}% | ${charging ? "Charging" : "Not Charging"} | ${timeLeft ? `${hours}h ${minutes}m left` : "Calculating..."}`;
        }

        navigator.getBattery().then(battery => {
            updateBatteryStatus(battery);
            battery.addEventListener('levelchange', () => updateBatteryStatus(battery));
            battery.addEventListener('chargingchange', () => updateBatteryStatus(battery));
            battery.addEventListener('dischargingtimechange', () => updateBatteryStatus(battery));
            battery.addEventListener('chargingtimechange', () => updateBatteryStatus(battery));
        });
    </script>
</body>
</html>
