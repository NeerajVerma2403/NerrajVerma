<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration & Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== General Styles ===== */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f2f5 0%, #e1e8ed 100%);
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(45deg, #2980b9, #6dd5fa);
            color: #fff;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }
        footer {
            background: #34495e;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        h2 {
            text-align: center;
            margin: 30px 0;
            color: #34495e;
            font-weight: 500;
        }

        /* ===== Form Card ===== */
        .form-card {
            max-width: 600px;
            background: #fff;
            margin: 20px auto 50px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .form-card:hover {
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }
        .form-card input, .form-card select, .form-card textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }
        .form-card input:focus, .form-card select:focus, .form-card textarea:focus {
            border-color: #2980b9;
            box-shadow: 0 0 5px rgba(41,128,185,0.3);
            outline: none;
        }
        .form-card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #2980b9, #6dd5fa);
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .form-card button:hover {
            background: linear-gradient(45deg, #1c5980, #3498db);
        }

        /* ===== Admin Section ===== */
        .admin-section {
            max-width: 95%;
            margin: 0 auto 100px auto; /* Added bottom margin for footer */
            padding: 20px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .admin-section h2 {
            margin-bottom: 20px;
        }
        .search-input {
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-right: 10px;
        }
        .admin-section button {
            padding: 10px 15px;
            background: #2980b9;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
            transition: 0.3s;
        }
        .admin-section button:hover {
            background: #1c5980;
        }

        /* ===== Table ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background: #2980b9;
            color: #fff;
            font-weight: 500;
        }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #eaf3fc; }

        /* ===== Action Buttons ===== */
        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            margin-right: 5px;
            transition: 0.3s;
        }
        .edit-btn { background: #27ae60; color: #fff; }
        .edit-btn:hover { background: #1e8449; }
        .delete-btn { background: #c0392b; color: #fff; }
        .delete-btn:hover { background: #922b21; }

        /* ===== Modal ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            width: 90%; max-width: 500px;
            position: relative;
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-in-out;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #c0392b;
        }
        .close-btn:hover { color: #e74c3c; }
        .modal-content input, .modal-content select, .modal-content textarea {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 100%;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #f39c12, #f1c40f);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-content button:hover {
            background: linear-gradient(45deg, #d68910, #d4ac0d);
        }

        /* ===== Animations ===== */
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }

        /* ===== Responsive ===== */
        @media(max-width:768px) {
            .form-card, .admin-section { width: 90%; }
            .search-input { width: 100%; margin-bottom: 10px; }
            .admin-section button { width: 100%; margin-bottom: 10px; }
            header h1 { font-size: 2em; }
        }
    </style>
</head>
<body>

<header>
    <h1>Student Management System</h1>
</header>

<h2>Student Registration Form</h2>
<div class="form-card">
    <form id="studentForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="fatherName" placeholder="Father's Name" required>
        <input type="tel" id="mobile" placeholder="Mobile Number" required>
        <input type="email" id="email" placeholder="Email ID" required>
        <textarea id="address" placeholder="Address" required></textarea>
        <input type="text" id="qualification" list="qualificationList" placeholder="Qualification (e.g., Master's M.Tech (CSE))" required>
        <datalist id="qualificationList">
            <option value="10th">
            <option value="12th">
            <option value="Bachelor">
            <option value="Masters">
            <option value="Master's M.Tech (CSE)">
            <option value="B.Tech (CSE)">
            <option value="PhD">
        </datalist>
        <textarea id="experience" placeholder="Job Experiences"></textarea>
        <button type="submit">Submit</button>
    </form>
</div>

<div class="admin-section">
    <h2>Admin Panel</h2>
    <input type="text" id="searchInput" class="search-input" placeholder="Search by any field">
    <button onclick="searchStudents()">Search</button>
    <button onclick="resetSearch()">Reset</button>
    <table id="studentsTable">
        <thead>
            <tr>
                <th>S. No.</th>
                <th>Name</th>
                <th>Father Name</th>
                <th>Mobile</th>
                <th>Email</th>
                <th>Address</th>
                <th>Qualification</th>
                <th>Job Experience</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- Modal for Edit -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3>Edit Student Data</h3>
        <input type="hidden" id="editIndex">
        <input type="text" id="editName" placeholder="Name" required>
        <input type="text" id="editFatherName" placeholder="Father's Name" required>
        <input type="tel" id="editMobile" placeholder="Mobile Number" required>
        <input type="email" id="editEmail" placeholder="Email ID" required>
        <textarea id="editAddress" placeholder="Address" required></textarea>
        <input type="text" id="editQualification" list="editQualificationList" placeholder="Qualification (e.g., Master's M.Tech (CSE))" required>
        <datalist id="editQualificationList">
            <option value="10th">
            <option value="12th">
            <option value="Bachelor">
            <option value="Masters">
            <option value="Master's M.Tech (CSE)">
            <option value="B.Tech (CSE)">
            <option value="PhD">
        </datalist>
        <textarea id="editExperience" placeholder="Job Experiences"></textarea>
        <button onclick="updateStudent()">Update</button>
    </div>
</div>

<footer>
    <p>&copy; 2023 Student Management System. All rights reserved.</p>
</footer>

<script>
let students = JSON.parse(localStorage.getItem("students")) || [];
const studentsTableBody = document.getElementById("studentsTable").getElementsByTagName("tbody")[0];

// Render table
function renderTable(data) {
    studentsTableBody.innerHTML = "";
    data.forEach((student, index) => {
        const row = studentsTableBody.insertRow();
        row.insertCell(0).innerText = index + 1;
        row.insertCell(1).innerText = student.name;
        row.insertCell(2).innerText = student.fatherName;
        row.insertCell(3).innerText = student.mobile;
        row.insertCell(4).innerText = student.email;
        row.insertCell(5).innerText = student.address;
        row.insertCell(6).innerText = student.qualification;
        row.insertCell(7).innerText = student.experience;
        row.insertCell(8).innerHTML = `
            <button class="action-btn edit-btn" onclick="openEditModal(${index})">Edit</button>
            <button class="action-btn delete-btn" onclick="deleteStudent(${index})">Delete</button>
        `;
    });
}

// Add new student
document.getElementById("studentForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const student = {
        name: document.getElementById("name").value,
        fatherName: document.getElementById("fatherName").value,
        mobile: document.getElementById("mobile").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value,
        qualification: document.getElementById("qualification").value,
        experience: document.getElementById("experience").value
    };
    students.push(student);
    localStorage.setItem("students", JSON.stringify(students));
    renderTable(students);
    this.reset();
    alert("Student registered successfully!");
});

// Open modal
function openEditModal(index) {
    const student = students[index];
    document.getElementById("editIndex").value = index;
    document.getElementById("editName").value = student.name;
    document.getElementById("editFatherName").value = student.fatherName;
    document.getElementById("editMobile").value = student.mobile;
    document.getElementById("editEmail").value = student.email;
    document.getElementById("editAddress").value = student.address;
    document.getElementById("editQualification").value = student.qualification;
    document.getElementById("editExperience").value = student.experience;
    document.getElementById("editModal").style.display = "flex";
}

// Close modal
function closeModal() { document.getElementById("editModal").style.display = "none"; }

// Update student
function updateStudent() {
    const index = document.getElementById("editIndex").value;
    students[index] = {
        name: document.getElementById("editName").value,
        fatherName: document.getElementById("editFatherName").value,
        mobile: document.getElementById("editMobile").value,
        email: document.getElementById("editEmail").value,
        address: document.getElementById("editAddress").value,
        qualification: document.getElementById("editQualification").value,
        experience: document.getElementById("editExperience").value
    };
    localStorage.setItem("students", JSON.stringify(students));
    renderTable(students);
    closeModal();
    alert("Student data updated successfully!");
}

// Delete student
function deleteStudent(index) {
    if (confirm("Are you sure you want to delete this student?")) {
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        renderTable(students);
    }
}

// Search
function searchStudents() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const filtered = students.filter(student =>
        student.name.toLowerCase().includes(query) ||
        student.fatherName.toLowerCase().includes(query) ||
        student.mobile.toLowerCase().includes(query) ||
        student.email.toLowerCase().includes(query) ||
        student.address.toLowerCase().includes(query) ||
        student.qualification.toLowerCase().includes(query) ||
        student.experience.toLowerCase().includes(query)
    );
    renderTable(filtered);
}

function resetSearch() {
    document.getElementById("searchInput").value = "";
    renderTable(students);
}

// Initial render
renderTable(students);
</script>

</body>
</html>
