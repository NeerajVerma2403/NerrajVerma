<style>
    .root{
        background: #b8e994 ;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Poppins;
    }

    .box{
        background: #ffeaa7;
        width: 1000px;
        height: 600px;
        border: 1px black solid;
    }

    .heading{
        padding: 2px;
        margin: 4px;
        display: flex;
        flex-direction: row;
        align-items: center;
    }

    .headingstyle{
        font-weight: 800;
        font-size:24;
        color: red;
        margin-left: 15px;
    }

    .centeralign{
        display: flex; justify-content: center; align-items: center;
    }
</style>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="/javascripts/project.js"></script>
    </head>
    <form action="/food/food_submit" method="post" enctype="multipart/form-data">
    <div class="root">
        <div class="box">
            <div class="heading" style="margin-bottom: 15px;">
                <img src="/images/haldiramlogo.png" width="60px" height="40px">
                <div class="headingstyle">
                    <b>FOOD MANAGEMENT SYSTEM</b>
                </div>

            </div>

            <div class="container formdiv">
                <div class="row" style="margin-bottom: 15px;">
                    <div class="col-sm-3">
                        <lable class="form-label"><b>Food Category Id</b></lable>
                        <input type="text" id="foodcategory_id" name="foodcategory_id" class="form-control" placeholder="Food Category ID">
                    </div>
                    <div class="col-sm-3">
                        <lable class="form-label"><b>Food Sub Category ID</b></lable>
                        <input type="text" id="foodsubcategory_id" name="foodsubcategory_id" class="form-control" placeholder="Food SubCategory ID">
                    </div>

                    <div class="col-sm-3">
                        <lable class="form-label"><b>Food Category</b></lable>
                        <select class="form-select" id="foodcategory" name="foodcategory">
                            <option selected>Food Category</option>
                            </select>
                    </div>

                    <div class="col-sm-3">
                        <lable class="form-label"><b>Food Sub Category</b></lable>
                        <select class="form-select" id="foodsubcategory" name="foodsubcategory">
                            <option selected>Food Sub Category</option>
                            </select>
                    </div>

                </div>

                <div class="row" style="margin-bottom: 15px;">
                    <div class="col-sm-3">
                        <lable class="form-label"><b>Food Name</b></lable>
                        <input type="text" id="foodname" name="foodname" class="form-control" placeholder="Enter Food Name">
                    </div>

                    <div class="col-sm-3">
                        <lable class="form-label"><b>Food Type</b></lable>
                        <select class="form-select" id="food_type" name="food_type">
                            <option selected>Food Type</option>
                            </select>
                    </div>

                    <div class="col-sm-6">
                        <lable class="form-label"><b>Food Ingredients</b></lable>
                        <input type="text" id="food_ingredients" name="food_ingredients" class="form-control" placeholder="Enter All Food Ingredients Names">
                    </div>

                </div>

                <div class="row" style="margin-bottom: 15px;">
                    <div class="col-sm-12">
                        <hr style="color: black; height: 4px;">

                    </div>

                </div>

                <div class="row" style="margin-bottom: 7px;">
                    <div class="col-sm-6">
                        <b>Food Variety:</b>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="foodvariety" value="Veg">Veg
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="foodvariety" value="Nonveg">NonVeg
                        </div>

                    </div>

                    <div class="col-sm-6">
                        <b>Food Status:</b>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="status" value="AVL">AVL
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="status" value="NOTAVL">NOTAVL
                        </div>

                    </div>

                    <div class="row" style="margin-bottom: 15px;">
                        <div class="col-sm-12">
                            <hr style="color: black; height: 4px;">
    
                        </div>
    
                    </div>

                    <div class="row" style="margin-bottom: 15px;">
                        <div class="col-sm-6">
                            <lable class="form-label"><b>Price</b></lable>
                            <input type="number" id="price" name="price" class="form-control" placeholder="Enter Price In INR">
                        </div>
    
                        <div class="col-sm-6">
                            <lable class="form-label"><b>Offer Price</b></lable>
                            <input type="number" id="offerprice" name="offerprice" class="form-control" placeholder="Enter Offer Price In INR">
                        </div>
    
                    </div>

                    <div class="row" style="margin-bottom: 15px">
                        <div class="col-sm-6">
                            <label for="formFile" class="form-label"><b>Upload Food Picture</b></label>
                            <input class="form-control" name="clogo" id="clogo" onchange="showPicture()" type="file">
    
                        </div>
    
                        <div class="col-sm-6 centeralign">
                            <img src="/images/haldiramlogo.png" id="cpic" name="cpic" style=" width: 40px; height: 30px; border-radius: 10px;">
    
                        </div>
    
                    </div>
    
                    <div class="row" style="margin-bottom: 15px">
                        <div class="col-sm-6 centeralign">
                            <button type="submit" class="btn btn-primary">Submit</button>
    
                        </div>
    
                        <div class="col-sm-6 centeralign">
                            <button type="reset" class="btn btn-primary">Reset</button>
    
                        </div>
    
                    </div>

                    <div class="row" style="margin-bottom: 7px">
                        <div class="col-sm-12 centeralign">
                            <%=message %>
    
                        </div>
    
                    </div>
            
                </div>
  
        </div>

    </div>
    </form>
</html>
