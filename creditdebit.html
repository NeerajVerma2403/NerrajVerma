<!DOCTYPE html>
<html>
<head>
    <title>Billing Software</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 10px; padding: 0; }
        h2 { text-align: center; margin-bottom: 10px; }
        input, select, button { width: 100%; margin: 5px 0; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 8px; text-align: left; border: 1px solid #ddd; font-size: 14px; }
        th { background-color: #f4f4f4; }
        button { background-color: blue; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: blue; }
        @media print {
            button, input, select { display: none; }
        }
    </style>
    <script>
        let items = [];

        function addItem() {
            const name = document.getElementById("itemName").value;
            const quantity = parseInt(document.getElementById("itemQuantity").value);
            const price = parseFloat(document.getElementById("itemPrice").value);
            const type = document.getElementById("itemType").value;

            if (name && quantity && price) {
                const amount = type === "debit" ? -price : price;
                const itemData = { name, quantity, price: amount, type, amount: (amount * quantity).toFixed(2) };
                items.push(itemData);
                renderTable();
                clearInputs();
            } else {
                alert("Please fill all fields correctly.");
            }
        }

        function clearInputs() {
            document.getElementById("itemName").value = "";
            document.getElementById("itemQuantity").value = "";
            document.getElementById("itemPrice").value = "";
            document.getElementById("itemType").value = "credit";
        }

        function clearTable() {
            items = [];
            renderTable();
        }

        function numberToWords(num) {
            const a = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
            const b = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
            if (num === 0) return "Zero";
            if (num < 20) return a[num];
            if (num < 100) return b[Math.floor(num / 10)] + " " + a[num % 10];
            if (num < 1000) return a[Math.floor(num / 100)] + " Hundred " + (num % 100 !== 0 ? numberToWords(num % 100) : "");
            if (num < 100000) return numberToWords(Math.floor(num / 1000)) + " Thousand " + (num % 1000 !== 0 ? numberToWords(num % 1000) : "");
            if (num < 10000000) return numberToWords(Math.floor(num / 100000)) + " Lakh " + (num % 100000 !== 0 ? numberToWords(num % 100000) : "");
            return numberToWords(Math.floor(num / 10000000)) + " Crore " + (num % 10000000 !== 0 ? numberToWords(num % 10000000) : "");
        }

        function renderTable() {
            const table = document.getElementById("billingTable");
            const totalInWords = document.getElementById("totalInWords");
            table.innerHTML = "";
            let total = 0;
            items.forEach((item, index) => {
                total += item.price * item.quantity;
                table.innerHTML += `<tr>
                    <th>${index + 1}</th>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.type.toUpperCase()}</td>
                    <td>₹ ${Math.abs(item.price).toFixed(2)}</td>
                    <td>₹ ${(item.price * item.quantity).toFixed(2)}</td>
                </tr>`;
            });
            totalInWords.innerHTML = "Total in Words: " + numberToWords(Math.abs(total)) + (total >= 0 ? " (CREDIT)" : " (DEBIT)");
        }

        function printBill() {
            window.print();
        }
    </script>
</head>
<body>
    <h2>Billing Software</h2>
    <input type="text" id="itemName" placeholder="Item Name" />
    <input type="number" id="itemQuantity" placeholder="Quantity" />
    <input type="number" id="itemPrice" placeholder="Price" step="0.01" />
    <select id="itemType">
        <option value="credit">Credit (Addition)</option>
        <option value="debit">Debit (Subtraction)</option>
    </select>
    <button onclick="addItem()">Add Item</button>
    <button onclick="printBill()">Print Bill</button>
    <button onclick="clearTable()">Clear All</button>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>Type</th>
                <th>Price (₹)</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody id="billingTable"></tbody>
    </table>
    <p id="totalInWords"></p>

    
</body>
</html>
