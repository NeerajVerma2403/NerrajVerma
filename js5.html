<script>
    function call()
    {
        var a=parseInt(text1.value)
        var b=parseInt(text2.value)
        var c=a+b
        result.innerHTML="Addition:"+c
    }

    function mul()
    {
        var a=parseInt(text1.value)
        var b=parseInt(text2.value)
        var c=a*b
        result.innerHTML="Multiple:"+c
    }

    function clearValue()
    {
        text1.value=" "
        text2.value=" "
        result.innerHTML="See Here....."
    }
</script>

<html>
    <input placeholder="Enter First Digit" type="text" id="text1"> <br><br>
    <input placeholder="Enter Second Digit" type="text" id="text2"> <br><br>
    <input type="button" value="Addition" onclick="call()">
    <input type="button" value="Multiple" onclick="mul()">
    <input type="button" value="Clear Screen" onclick="clearValue()"><br>
    <div id="result">See Here.....</div>
</html>
