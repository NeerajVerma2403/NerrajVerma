<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirect Button</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .redirect-btn {
      padding: 15px 35px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .redirect-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Replace the URL below with your website -->
  <button class="redirect-btn" onclick="window.location.href='https://www.youtube.com/'">
    Visit Website
  </button>

</body>
</html>
