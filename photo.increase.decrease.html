<script>
    function call()
    {
        im.width=500
        im.height=500
    }
    function callme()
    {
        im.width=150
        im.height=150
    }
</script>
<html>
    <center>
        <img id="im" width="150" height="150" src="David Putra.png" onmouseover="call()" onmouseleave="callme()">
    </center>
</html>
